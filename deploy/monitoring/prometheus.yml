global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'rag-api'
    static_configs:
      - targets: ['api:9090']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'rag-api-health'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /health
    scrape_interval: 30s

  - job_name: 'milvus'
    static_configs:
      - targets: ['milvus:9091']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

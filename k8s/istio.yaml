# Istio服务网格配置
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: rag-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "rag-api.example.com"
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: rag-api-tls
    hosts:
    - "rag-api.example.com"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: rag-api
spec:
  hosts:
  - "rag-api.example.com"
  gateways:
  - rag-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: rag-api
        port:
          number: 80
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: gateway-error,connect-failure,refused-stream
  - match:
    - uri:
        prefix: /metrics
    route:
    - destination:
        host: rag-api
        port:
          number: 9090
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: rag-api-mtls
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: rag-api-authz
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/default/sa/rag-api"]
  - to:
    - operation:
        methods: ["GET"]
        paths: ["/health", "/ready", "/metrics"]

# RAG Demo - Docker Compose 配置
# 单机版，一键启动 Milvus + 项目服务

version: '3.8'

services:
  # Milvus Standalone（向量数据库）
  milvus:
    image: milvusdb/milvus:v2.3.6
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio

  # Etcd（Milvus 依赖）
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  # MinIO（Milvus 对象存储）
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"

  # RAG Demo 服务
  rag-demo:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config.py:/app/config.py
    environment:
      - MILVUS_HOST=milvus
      - SQLITE_DB_PATH=/app/data/rag_demo.db
      - UPLOAD_DIR=/app/data/uploads
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  milvus_data:
  etcd_data:
  minio_data:

# 使用说明：
# 1. 启动：docker-compose up -d
# 2. 查看日志：docker-compose logs -f rag-demo
# 3. 停止：docker-compose down
# 4. 完全清理（包括数据）：docker-compose down -v
